[project]
name = "knxlens"
version = "0.1.0"
description = "Blick in eine laufende KNX-Anlage: rein lesend scannen, Tabellen und Parameter dekodieren, mitschneiden, nach ETS exportieren"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "xknx>=4.0,<5",
    "xknxproject>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
knxlens = "knxlens.cli:main"

[tool.setuptools]
packages = ["knxlens", "knxlens.web", "knxlens.editor", "knxlens.project"]

[tool.setuptools.package-data]
"knxlens.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/editor/*", "static/editor/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: Oberflächentests im Browser (Playwright, sonst übersprungen)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# l (Link), Lambda-Zuweisungen und lange Tabellenzeilen sind hier gewollt; zip() über ungleich
# lange Folgen ist an einigen Stellen beabsichtigt
ignore = ["E741", "E731", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E701", "E702"]  # Diagnoseskripte, knapp gehalten
