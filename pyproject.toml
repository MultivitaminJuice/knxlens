[project]
name = "knxrecon"
version = "0.1.0"
description = "KNX-Anlage ohne ETS-Projekt rein lesend rekonstruieren"
requires-python = ">=3.11"
dependencies = [
    "xknx>=4.0,<5",
    "xknxproject>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
knxrecon = "knxrecon.cli:main"

[tool.setuptools]
packages = ["knxrecon", "knxrecon.web"]

[tool.setuptools.package-data]
"knxrecon.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
