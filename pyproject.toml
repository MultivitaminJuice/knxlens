[project]
name = "knxlens"
version = "0.1.0"
description = "Blick in eine laufende KNX-Anlage: rein lesend scannen, Tabellen und Parameter dekodieren, mitschneiden, nach ETS exportieren"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "xknx>=4.0,<5",
    "xknxproject>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
knxlens = "knxlens.cli:main"

[tool.setuptools]
packages = ["knxlens", "knxlens.web"]

[tool.setuptools.package-data]
"knxlens.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
