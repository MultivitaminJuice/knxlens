<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KNX-Rekonstruktion{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <span class="brand">KNX-Rekonstruktion</span>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'active' if path == '/' or path.startswith('/device') }}">Geräte</a>
      <a href="/gas" class="{{ 'active' if path.startswith('/gas') }}">Gruppenadressen</a>
      <a href="/traffic" class="{{ 'active' if path.startswith('/traffic') }}">Verkehr</a>
      {% if has_ref %}<a href="/compare" class="{{ 'active' if path.startswith('/compare') }}">Abgleich</a>{% endif %}
    </nav>
    <form method="post" action="/api/reload"><button title="Daten aus der Datenbank neu dekodieren">Neu laden</button></form>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
